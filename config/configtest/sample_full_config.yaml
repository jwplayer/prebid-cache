port: 9000
admin_port: 2525
index_response: "Any index response"
log:
  level: "info"
rate_limiter:
  enabled: false
  num_requests: 150
request_limits:
  max_size_bytes: 10240
  max_num_values: 10
  max_ttl_seconds: 5000
  allow_setting_keys: true
  max_header_size_bytes: 16384
backend:
  type: "memory"
  aerospike:
    default_ttl_seconds: 3600
    host: "aerospike.prebid.com"
    hosts: ["aerospike2.prebid.com", "aerospike3.prebid.com"]
    port: 3000
    namespace: "whatever"
    user: "foo"
    password: "bar"
    connection_idle_timeout_seconds: 2
  cassandra:
    hosts: "127.0.0.1"
    keyspace: "prebid"
    default_ttl_seconds: 60
  memcache:
    hosts: ["10.0.0.1:11211","127.0.0.1"]
  redis:
    # Single instance mode
    host: "127.0.0.1"
    port: 6379
    password: "redis-password"
    db: 1
    expiration: 1
    # Cluster mode (alternative to host/port above)
    # addrs: ["127.0.0.1:7000", "127.0.0.1:7001", "127.0.0.1:7002"]
    # Connection pool settings (optional)
    # pool_size: 10
    # min_idle_conns: 5
    # max_retries: 3
    # dial_timeout: 5
    # read_timeout: 3
    # write_timeout: 3
    # pool_timeout: 4
    tls:
      enabled: false
      insecure_skip_verify: false
  ignite:
    scheme: "http"
    host: "127.0.0.1"
    port: 8080
    secure: false
    headers: !!omap
      - Content-Length: 0
    cache:
      name: "whatever"
      create_on_start: false
compression:
  type: "snappy"
metrics:
  type: "none"
  influx:
    host: "metrics-host"
    database: "metrics-database"
    username: "metrics-username"
    password: "metrics-password"
    enabled: true
  prometheus:
    port: 8080
    namespace: "prebid"
    subsystem: "cache"
    timeout_ms: 100
    enabled: true
routes:
  allow_public_write: true
